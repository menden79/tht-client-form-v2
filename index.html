<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>THT – Bảng thu thập thông tin khách hàng</title>
<meta name="description" content="Phiếu thu thập thông tin khách hàng của Công ty TNHH Kiểm toán và Tư vấn THT.">
<link rel="icon" href="form-thtaudit-logo.png">
<style>
  html,body{margin:0;padding:0;height:100%;background:#fff}
  #khung{display:block;width:100%;height:100dvh;border:0}
  @supports not (height:100dvh){#khung{height:100vh}}
  #duPhong{display:none;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
           max-width:640px;margin:16vh auto;padding:0 24px;color:#333;text-align:center}
  #duPhong a{color:#0067b8}
</style>
</head>
<body>

<iframe id="khung"
        src="https://thtdn-crm-dev.thtdn.workers.dev/form"
        title="Bảng thu thập thông tin khách hàng THT"
        allow="clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin"></iframe>

<div id="duPhong">
  <p>Không tải được biểu mẫu.</p>
  <p>Vui lòng mở trực tiếp tại
     <a href="https://thtdn-crm-dev.thtdn.workers.dev/form">đường dẫn này</a>,
     hoặc gửi thông tin về <a href="mailto:tht@thtaudit.com.vn">tht@thtaudit.com.vn</a>.</p>
  <p>Điện thoại: (028) 3517 8796</p>
</div>

<script>
// Khung không tải được trong 12 giây thì hiện phần dự phòng
(function () {
  var xong = false, k = document.getElementById('khung');
  k.addEventListener('load', function () { xong = true; });
  setTimeout(function () {
    if (xong) return;
    k.style.display = 'none';
    document.getElementById('duPhong').style.display = 'block';
  }, 12000);
})();
</script>

</body>
</html>
